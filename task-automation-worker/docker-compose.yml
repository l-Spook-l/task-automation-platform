services:

  api:
    build:
      context: ..
      dockerfile: task-automation-worker/Dockerfile
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: task-automation-worker/Dockerfile
    command: uv run celery -A src.core.celery worker --loglevel=info
    volumes:
      - ./data:/app/data
    depends_on:
      - redis

  flower:
    build:
      context: ..
      dockerfile: task-automation-worker/Dockerfile
    container_name: flower_app_tasks
    command:  uv run celery -A src.core.celery flower
    ports:
      - "5555:5555"
    depends_on:
      - worker

  redis:
    image: redis:7
    ports:
      - "6379:6379"